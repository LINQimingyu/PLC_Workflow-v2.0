name: Docker deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLC_WORKFLOW_PORT: "18772"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and run backend evaluations
        run: docker build --target test -t plc-workflow-v2:test .
      - name: Start production container
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Check login, CSRF, workflow and persistence
        run: python3 deploy/smoke.py
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop containers
        if: always()
        run: docker compose down
